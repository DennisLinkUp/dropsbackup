<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#E48C3A" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <title>Drops öffnen</title>

  <!-- Smart App Banner: zeigt iOS-User automatisch einen "OPEN/INSTALL"-Button für die Drops-App -->
  <meta name="apple-itunes-app" content="app-id=6762097493">

  <link rel="apple-touch-icon" href="/app-icon.png">
  <link rel="icon" href="/app-icon.png">

  <style>
    /* Drops Universal-Link Landing — Sunset Aurora Design */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    :root {
      --orange:   #E48C3A;
      --green:    #5FA937;
      --bg:       #FAFAFC;
      --text:     #111418;
      --text-2:   rgba(17,20,24,0.66);
      --text-3:   rgba(17,20,24,0.42);
      --border:   rgba(0,0,0,0.08);
      --gradient: linear-gradient(135deg, #E48C3A 0%, #5FA937 100%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:     #0D0F14;
        --text:   #F5F5F7;
        --text-2: rgba(245,245,247,0.65);
        --text-3: rgba(245,245,247,0.42);
        --border: rgba(255,255,255,0.10);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Aurora-Background */
    body::before, body::after {
      content: ""; position: fixed; z-index: -1;
      border-radius: 50%; filter: blur(80px);
      pointer-events: none;
    }
    body::before {
      width: 460px; height: 460px;
      background: var(--orange); opacity: 0.22;
      top: -100px; left: -60px;
    }
    body::after {
      width: 360px; height: 360px;
      background: var(--green); opacity: 0.16;
      bottom: -80px; right: -60px;
    }
    @media (prefers-color-scheme: dark) {
      body::before { opacity: 0.28; }
      body::after  { opacity: 0.22; }
    }

    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .icon {
      width: 128px;
      height: 128px;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(228,140,58,0.30), 0 8px 24px rgba(0, 0, 0, 0.08);
      margin: 0 auto 28px;
      display: block;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.035em;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: var(--text-2);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      padding: 16px 22px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 12px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--gradient);
      color: #fff;
      box-shadow: 0 10px 30px rgba(228,140,58,0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 36px rgba(228,140,58,0.42); }
    .btn-secondary {
      background: rgba(0, 0, 0, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }
    @media (prefers-color-scheme: dark) {
      .btn-secondary { background: rgba(255,255,255,0.06); }
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-3);
    }
    .footer a {
      color: var(--text-2);
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover { color: var(--text); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/app-icon.png" alt="Drops" class="icon">
    <h1>Drops öffnen</h1>
    <p id="subtitle">
      Tippe auf den Button — wenn du Drops installiert hast, öffnet sich die App direkt.
      Sonst lädst du sie kostenlos im App Store.
    </p>

    <!-- Primary: Versuche App per Universal Link zu öffnen -->
    <a id="openApp" class="btn btn-primary" href="#">
      📲 In Drops öffnen
    </a>

    <!-- Fallback: App Store -->
    <a class="btn btn-secondary" href="https://apps.apple.com/de/app/drops-triff-leute/id6762097493">
      Im App Store laden
    </a>

    <div class="footer">
      <a href="/">drops-app.de</a>
    </div>
  </div>

  <script>
    // Re-konstruiere den Original-Universal-Link aus dem aktuellen Pfad
    // (z.B. /drop/<UUID> oder /invite/<UID>) und triggere ihn beim Klick.
    (function () {
      const path = window.location.pathname;
      const target = "https://www.drops-app.de" + path;
      const openBtn = document.getElementById("openApp");
      openBtn.href = target;

      // Auf iOS / Safari: nach 1.5s Fallback auf App Store wenn die App
      // den Universal Link nicht abfängt (= App nicht installiert).
      openBtn.addEventListener("click", function (e) {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        if (!isIOS) return;  // Auf Desktop: einfach Universal Link folgen lassen

        // Auf iOS: nach 1.5s prüfen ob wir noch auf der Page sind → dann App Store
        const fallbackTimer = setTimeout(function () {
          window.location.href = "https://apps.apple.com/de/app/drops-triff-leute/id6762097493";
        }, 1500);

        // Wenn die Page in den Hintergrund geht (App hat geöffnet) → Timer canceln
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) clearTimeout(fallbackTimer);
        });
      });

      // Subtitle anpassen je nach URL-Typ
      const subtitle = document.getElementById("subtitle");
      if (path.startsWith("/drop/")) {
        subtitle.textContent = "Jemand hat dir einen Drop geschickt. Tippe um ihn in der App zu öffnen.";
      } else if (path.startsWith("/invite/")) {
        subtitle.textContent = "Du wurdest zu Drops eingeladen — tippe um die App zu öffnen oder lade sie kostenlos im App Store.";
      }
    })();
  </script>
</body>
</html>
